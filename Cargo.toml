[package]
name = "nix-compute"
version = "0.3.0"
edition = "2021"
description = "Build reproducible compute tasks from Nix Flakes"
license = "Apache-2.0"
repository = "https://github.com/kai-compute/nix-compute"

[workspace]
members = ["crates/protocol", "crates/provider-reference"]
resolver = "2"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix-compute-protocol = { path = "crates/protocol" }
