[package]
name = "nix-compute-protocol"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kai-compute/nix-compute"
description = "Task and execution contracts shared by compute builders and providers"

[features]
test-fixtures = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.14"
