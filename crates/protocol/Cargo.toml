[package]
name = "nix-compute-protocol"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/kai-compute/nix-compute"
description = "Task and execution contracts shared by compute builders and providers"

[features]
test-fixtures = []

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
nix-bindings-expr = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }
nix-bindings-store = { git = "https://github.com/cachix/nix-bindings-rust.git", branch = "2.35" }

[dev-dependencies]
tempfile = "3.14"
